name: CI
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: gpui-kit-material

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: gpui-kit-material
      # rust-toolchain.toml pins the exact compiler, components and targets.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui-kit-material -> target
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Check the upstream comparison backend
        run: |
          cargo clippy --locked -p gpui-kit-material --all-targets --no-default-features --features serde,embedded-symbols,frame-profiler -- -D warnings
          cargo test --locked -p gpui-kit-material --no-default-features --features serde,embedded-symbols,frame-profiler
      - name: Check and test the Fast backend
        run: |
          cargo clippy --locked --workspace --all-targets --features gpui-kit-material/gpui-fast,gpui-kit-material/frame-profiler -- -D warnings
          cargo test --locked --workspace --features gpui-kit-material/gpui-fast,gpui-kit-material/frame-profiler
          cargo test --locked -p gpui-kit-material --example gallery --features gpui-fast,frame-profiler
      - name: Vendored text layout regression tests
        if: runner.os == 'macOS'
        run: |
          cargo test -p gpui-pre --test line_layout_options
          cargo test -p gpui-pre --lib text_system
          cargo test --locked -p gpui-kit-material -p gpui-fast --features gpui-kit-material/gpui-fast,gpui-kit-material/frame-profiler --lib
          cargo test --locked -p gpui-kit-material -p gpui-fast --features gpui-kit-material/gpui-fast,gpui-kit-material/frame-profiler --test line_layout_options

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gpui-kit-material
      # rust-toolchain.toml pins the exact compiler, components and targets.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui-kit-material -> target
      - name: Check the upstream WASM gallery
        run: cargo clippy --locked -p gpui-kit-material-gallery-web --target wasm32-unknown-unknown --no-default-features -- -D warnings
      - name: Install the matching browser binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build upstream browser artifacts
        run: ./scripts/build-gallery-web.sh --upstream
      - name: Check the Fast WASM gallery
        run: cargo clippy --locked -p gpui-kit-material-gallery-web --target wasm32-unknown-unknown --features gpui-fast -- -D warnings
      - name: Build Fast browser artifacts
        run: ./scripts/build-gallery-web.sh --fast
