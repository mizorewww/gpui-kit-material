name: CI
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: gpui-kit-material

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: gpui-kit-material
      - uses: actions/checkout@v4
        with:
          repository: mizorewww/gpui-material-symbols
          ref: d73f27c1b14d1a8330fb837945bb09b282257f1e
          path: gpui-material-symbols
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui-kit-material -> target
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Vendored text layout regression tests
        if: runner.os == 'macOS'
        run: |
          cargo test -p gpui-pre --test line_layout_options
          cargo test -p gpui-pre --lib text_system

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gpui-kit-material
      - uses: actions/checkout@v4
        with:
          repository: mizorewww/gpui-material-symbols
          ref: d73f27c1b14d1a8330fb837945bb09b282257f1e
          path: gpui-material-symbols
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui-kit-material -> target
      - name: Check the WASM gallery
        run: cargo clippy --locked -p gpui-kit-material-gallery-web --target wasm32-unknown-unknown -- -D warnings
      - name: Install the matching browser binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build browser artifacts
        run: ./scripts/build-gallery-web.sh
