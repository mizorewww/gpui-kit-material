[workspace]
resolver = "3"
members = ["crates/color", "crates/material", "crates/gallery", "crates/gallery-web", "crates/bench"]
exclude = ["vendor/gpui-kit", "vendor/gpui-pre", "vendor/gpui-pre-web", "vendor/gpui-pre-apple", "vendor/gpui-fast", "vendor/gpui-fast-apple"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
rust-version = "1.98"
repository = "https://github.com/mizorewww/gpui-kit-material"
authors = ["mizorewww"]

[workspace.dependencies]
gpui-kit-material-color = { path = "crates/color", version = "0.1.1", default-features = false }

# Kit owns application initialization and the Component layer; GPUI and Base must be
# shared, so Base is the same release.
gpui-kit = "0.9.1"
# Base supplies presentation capabilities not exposed by Component; Kit selects
# its engine backend along with the facade's public types.
gpui-base = "0.9.1"

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.gpui-pre]
opt-level = 3

# gpui-fast is the default backend; keep its dev builds as fast as gpui-pre.
[profile.dev.package.gpui-fast]
opt-level = 3

# The browser module only (scripts/build-gallery-web.sh --release): a host caps the file
# at 25 MiB, and every byte is downloaded. The default `release` stays as profiles measure it.
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1

[patch.crates-io]
# Kit 0.9.1's source with a manifest that keeps WASM single-threaded by default
# (vendor/gpui-kit/SOURCE.md); Symbols' `gpui-kit` is this one too.
gpui-kit = { path = "vendor/gpui-kit" }
# The engine's remaining local patches, for this workspace (docs/ARCHITECTURE.md).
gpui-fast = { path = "vendor/gpui-fast" }
gpui-fast-apple = { path = "vendor/gpui-fast-apple" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-web = { path = "vendor/gpui-pre-web" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
