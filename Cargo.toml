[workspace]
resolver = "3"
members = ["crates/color", "crates/material", "crates/gallery-web"]
exclude = ["vendor/gpui-kit", "vendor/gpui-base", "vendor/gpui-pre", "vendor/gpui-pre-web", "vendor/gpui-pre-apple", "vendor/gpui-fast", "vendor/gpui-fast-web", "vendor/gpui-fast-apple", "vendor/gpui-fast-macos", "vendor/gpui-pre-macos", "vendor/gpui-fast-linux", "vendor/gpui-fast-wgpu", "vendor/gpui-fast-windows", "vendor/gpui-pre-linux", "vendor/gpui-pre-wgpu", "vendor/gpui-pre-windows", "vendor/wgpu"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mizorewww/gpui-kit-material"
authors = ["mizorewww"]

[workspace.dependencies]
gpui-kit-material-color = { path = "crates/color", version = "0.1.0" }

# Kit owns application initialization and the Component layer. Cargo.lock pins
# this branch to the audited revision; GPUI and the patched Base must be shared.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", branch = "main" }
# Base supplies presentation capabilities not exposed by Component; Kit selects
# its engine backend along with the facade's public types.
gpui-base = { version = "=0.8.1" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.gpui-pre]
opt-level = 3

# gpui-fast is the default backend; keep its dev builds as fast as gpui-pre.
[profile.dev.package.gpui-fast]
opt-level = 3

[patch.crates-io]
gpui-fast-macos = { path = "vendor/gpui-fast-macos" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-fast = { path = "vendor/gpui-fast" }
gpui-fast-web = { path = "vendor/gpui-fast-web" }
gpui-fast-apple = { path = "vendor/gpui-fast-apple" }
gpui-base = { path = "vendor/gpui-base" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-web = { path = "vendor/gpui-pre-web" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-fast-linux = { path = "vendor/gpui-fast-linux" }
gpui-fast-wgpu = { path = "vendor/gpui-fast-wgpu" }
gpui-fast-windows = { path = "vendor/gpui-fast-windows" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
wgpu = { path = "vendor/wgpu" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-kit = { path = "vendor/gpui-kit" }
gpui-base = { path = "vendor/gpui-base" }
