[workspace]
resolver = "3"
members = ["crates/color", "crates/material", "crates/gallery", "crates/gallery-web", "crates/bench"]
exclude = ["vendor/gpui-kit", "vendor/gpui-pre", "vendor/gpui-pre-web", "vendor/gpui-pre-apple", "vendor/gpui-fast", "vendor/gpui-fast-web", "vendor/gpui-fast-apple", "vendor/gpui-fast-macos", "vendor/gpui-fast-linux", "vendor/gpui-fast-wgpu", "vendor/gpui-fast-windows"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
repository = "https://github.com/mizorewww/gpui-kit-material"
authors = ["mizorewww"]

[workspace.dependencies]
gpui-kit-material-color = { path = "crates/color", version = "0.1.0", default-features = false }

# Kit owns application initialization and the Component layer, at the audited
# revision of vendor/gpui-kit; GPUI and Base must be shared.
# `version` is what a packaged crate names instead of the Git source; see docs/RELEASING.md.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "8da4e005258ac0aac9a6a332cce746eeaafa08a8", version = "0.9.0" }
# Base supplies presentation capabilities not exposed by Component; Kit selects
# its engine backend along with the facade's public types.
gpui-base = { version = "=0.9.0" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.gpui-pre]
opt-level = 3

# gpui-fast is the default backend; keep its dev builds as fast as gpui-pre.
[profile.dev.package.gpui-fast]
opt-level = 3

# The browser module only (scripts/build-gallery-web.sh --release): a host caps the file
# at 25 MiB, and every byte is downloaded. The default `release` stays as profiles measure it.
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1

[patch.crates-io]
# Symbols depends on crates.io `gpui-kit`; it must be the same Kit as the Git one.
gpui-kit = { path = "vendor/gpui-kit" }
gpui-fast-macos = { path = "vendor/gpui-fast-macos" }
gpui-fast = { path = "vendor/gpui-fast" }
gpui-fast-web = { path = "vendor/gpui-fast-web" }
gpui-fast-apple = { path = "vendor/gpui-fast-apple" }
# Base is Kit main's, unmodified; crates.io 0.9.0 lacks what Material calls.
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "8da4e005258ac0aac9a6a332cce746eeaafa08a8" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-web = { path = "vendor/gpui-pre-web" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-fast-linux = { path = "vendor/gpui-fast-linux" }
gpui-fast-wgpu = { path = "vendor/gpui-fast-wgpu" }
gpui-fast-windows = { path = "vendor/gpui-fast-windows" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-kit = { path = "vendor/gpui-kit" }
