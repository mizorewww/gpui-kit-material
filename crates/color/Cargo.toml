[package]
name = "gpui-kit-material-color"
description = "Material 3 color roles, built-in palettes and scheme derivation for gpui-kit-material, without a GPUI dependency"
version.workspace = true
edition.workspace = true
# MIT, plus the Apache-2.0 port of material-color-utilities in src/dynamic.
license = "MIT AND Apache-2.0"
repository.workspace = true
authors.workspace = true
keywords = ["material", "color", "theme", "gpui"]
categories = ["gui"]

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
