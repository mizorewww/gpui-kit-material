[package]
name = "gpui-kit-material"
description = "Material 3 design tokens, motion and components for GPUI, built on GPUI Base"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["material", "material-design", "gpui", "ui", "desktop"]
categories = ["gui"]

[features]
default = ["serde"]
serde = ["gpui-kit-material-color/serde"]

[dependencies]
gpui-kit-material-color.workspace = true
gpui.workspace = true
gpui-base.workspace = true
anyhow.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false }
gpui-material-symbols = { path = "../../../gpui-material-symbols", default-features = false }
resvg = { version = "0.46", default-features = false }
tiny-skia = { version = "0.11", features = ["png-format"] }
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui-base = { workspace = true, features = ["test-support"] }

[[example]]
name = "gallery"

[[example]]
name = "material_symbols"
path = "examples/material_symbols/main.rs"
