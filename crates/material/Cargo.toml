[package]
name = "gpui-kit-material"
description = "Material 3 design tokens, motion and component adapters for Longbridge GPUI Kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# MIT (LICENSE, src/motion/LICENSE-material), plus Apache-2.0 for the rules ported
# from androidx (src/components/LICENSE-androidx, src/shapes/LICENSE-androidx).
license = "MIT AND Apache-2.0"
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["material", "material-design", "gpui", "ui", "desktop"]
categories = ["gui"]
# The gallery and benchmarks stay in the repository: the gallery bundles OFL-1.1
# fonts, which the library does not use. gpui-kit-material-gallery-web declares them.
exclude = ["examples/"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["serde", "embedded-symbols", "gpui-fast"]
embedded-symbols = ["gpui-material-symbols/embed-assets"]
serde = ["gpui-kit-material-color/serde"]
frame-profiler = ["gpui-kit/profiler"]
gpui-fast = ["gpui-kit/gpui-fast"]
# The Gallery's per-frame instruction counts; see `examples/gallery/instr_bench.rs`.
instruction-bench = ["gpui-fast"]

[dependencies]
gpui-kit-material-color.workspace = true
gpui-kit.workspace = true
gpui-material-symbols = { git = "https://github.com/mizorewww/gpui-material-symbols", rev = "593aa15a46076f3e2870c23c0e4fd79f94f105bd", default-features = false, features = ["gpui-kit"] }
gpui-base.workspace = true
# Already in Cargo.lock through GPUI Base's calendar; the pickers share its date types.
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1"

[dev-dependencies]
# Only the icon asset-source test and the native gallery example use anyhow.
anyhow.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
serde_json.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }

[[example]]
name = "gallery"
