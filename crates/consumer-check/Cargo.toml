# Not a workspace member: this is what a downstream application's manifest looks
# like. It proves the library builds against the patches a consumer needs, including
# the web backends' IME position and the lazy tab-stop index (tested by CI's engine rules
# step), without the dev-only frame observation, and that Kit's FPS HUD builds beside it.
# It reads them from this checkout; CI's git-consumer job builds the same set from Git.
[package]
name = "consumer-check"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []
gpui-fast = ["gpui-kit/gpui-fast", "gpui-kit-material/gpui-fast", "gpui-fps/gpui-fast"]

[dependencies]
# `profiler` is what the engine rules in CI's consumer step test.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "8dfdd49de27c0726dd052fb2cfd2b0807d17980b", features = ["profiler"] }
gpui-fps = { git = "https://github.com/longbridge/gpui-kit", rev = "8dfdd49de27c0726dd052fb2cfd2b0807d17980b" }
gpui-kit-material = { path = "../material", default-features = false, features = ["full", "serde", "embedded-symbols"] }

# Lets `cargo test -p consumer-check -p gpui-pre --lib` run the engine tests with
# frame observation off.
[dev-dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "8dfdd49de27c0726dd052fb2cfd2b0807d17980b", features = ["test-support"] }

[workspace]

[patch.crates-io]
gpui-kit = { path = "../../vendor/gpui-kit" }
gpui-base = { path = "../../vendor/gpui-base" }
gpui-pre = { path = "../../vendor/gpui-pre" }
gpui-pre-apple = { path = "../../vendor/gpui-pre-apple" }
gpui-pre-web = { path = "../../vendor/gpui-pre-web" }
gpui-fast = { path = "../../vendor/gpui-fast" }
gpui-fast-apple = { path = "../../vendor/gpui-fast-apple" }
gpui-fast-web = { path = "../../vendor/gpui-fast-web" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-kit = { path = "../../vendor/gpui-kit" }
gpui-base = { path = "../../vendor/gpui-base" }
