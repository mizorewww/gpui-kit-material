# Not a workspace member: this is what a downstream application's manifest looks
# like with ARCHITECTURE.md's consumer patch set: Kit from crates.io, the engine patches the Gallery
# builds on (tested by CI's engine rules step) from this checkout, and Kit's FPS HUD beside
# the library. The library needs none of these patches to build; scripts/check-registry-
# consumer.sh builds it without them. CI's git-consumer job builds the same set from Git.
[package]
name = "consumer-check"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []
gpui-fast = ["gpui-kit/gpui-fast", "gpui-kit-material/gpui-fast", "gpui-fps/gpui-fast"]

[dependencies]
# `profiler` is what the engine rules in CI's consumer step test.
gpui-kit = { version = "0.9.1", features = ["profiler"] }
gpui-fps = "0.9.1"
gpui-kit-material = { path = "../material", default-features = false, features = ["full", "serde", "embedded-symbols"] }

# Lets `cargo test -p consumer-check -p gpui-pre --lib` run the engine tests as a
# consumer's engine builds them.
[dev-dependencies]
gpui-kit = { version = "0.9.1", features = ["test-support"] }

[workspace]

[patch.crates-io]
gpui-kit = { path = "../../vendor/gpui-kit" }
gpui-pre = { path = "../../vendor/gpui-pre" }
gpui-pre-apple = { path = "../../vendor/gpui-pre-apple" }
gpui-pre-web = { path = "../../vendor/gpui-pre-web" }
gpui-fast = { path = "../../vendor/gpui-fast" }
