<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fef7ff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141218">
    <meta name="description" content="Interactive gallery of Material 3 Expressive components for GPUI, running in the browser.">
    <title>Material Gallery</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%236750a4'/%3E%3Ccircle cx='12' cy='12' r='5' fill='%23fff'/%3E%3C/svg%3E">
    <!--gallery-preload-->
    <style>
      :root {
        --surface: #fef7ff; --on-surface: #1d1b20; --on-surface-variant: #49454f;
        --primary: #6750a4; --track: #e8def8; --container: #f3edf7; --error: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #141218; --on-surface: #e6e0e9; --on-surface-variant: #cac4d0;
          --primary: #d0bcff; --track: #4a4458; --container: #211f26; --error: #f2b8b5;
        }
      }
      html, body {
        margin: 0; width: 100%; height: 100%; overflow: hidden;
        overscroll-behavior: none; background: var(--surface);
      }
      canvas { display: block; }
      #splash {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px; padding: 24px;
        box-sizing: border-box; background: var(--surface); color: var(--on-surface);
        font: 400 16px/24px Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center; transition: opacity 150ms linear;
      }
      #splash[hidden] { display: none; }
      #splash.done { opacity: 0; pointer-events: none; }
      #splash h1 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; }
      #splash p { margin: 0; max-width: 56ch; color: var(--on-surface-variant); }
      #status { min-height: 24px; }
      #progress {
        width: min(280px, 80vw); height: 4px; border-radius: 2px;
        overflow: hidden; background: var(--track);
      }
      #bar {
        width: 100%; height: 100%; border-radius: 2px; background: var(--primary);
        transform: translateX(-100%); transition: transform 120ms linear;
      }
      #progress.indeterminate #bar {
        width: 40%; transition: none; animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      #detail {
        display: none; max-width: min(640px, 90vw); max-height: 30vh; margin: 0; overflow: auto;
        padding: 12px; border-radius: 12px; background: var(--container);
        color: var(--on-surface-variant); font: 12px/18px ui-monospace, Menlo, Consolas, monospace;
        text-align: left; white-space: pre-wrap; overflow-wrap: anywhere;
      }
      #splash.failed h1 { color: var(--error); }
      #splash.failed #progress { display: none; }
      #splash.failed #detail:not(:empty) { display: block; }
      @media (prefers-reduced-motion: reduce) {
        #splash, #bar { transition: none; }
        #progress.indeterminate #bar { animation: none; width: 100%; opacity: 0.5; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <h1 id="title">Material Gallery</h1>
      <p id="status" role="status" aria-live="polite">Loading…</p>
      <div id="progress" class="indeterminate" role="progressbar" aria-label="Loading Material Gallery"><div id="bar"></div></div>
      <pre id="detail"></pre>
      <noscript><p>The Material Gallery needs JavaScript and WebAssembly.</p></noscript>
    </div>
    <!--gallery-assets-->
    <script type="module" src="./main.js"></script>
  </body>
</html>
