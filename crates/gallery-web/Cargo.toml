[package]
name = "gpui-kit-material-gallery-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["gpui-fast"]
gpui-fast = ["gpui-kit/gpui-fast", "gpui-kit-material/gpui-fast"]

# Shared Gallery source contains native-only profiling code. This acknowledges
# that source's cfg without advertising a browser frame collector.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("frame-profiler", "instruction-bench"))'] }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-kit.workspace = true
gpui-base.workspace = true
gpui-kit-material = { path = "../material", default-features = false, features = ["serde"] }
wasm-bindgen = "=0.2.129"
web-sys = { version = "=0.3.106", features = ["Window", "MediaQueryList", "MediaQueryListEvent", "EventTarget"] }
