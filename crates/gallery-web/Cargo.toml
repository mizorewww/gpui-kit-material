[package]
name = "gpui-kit-material-gallery-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["gpui-fast"]
gpui-fast = ["gpui-kit/gpui-fast", "gpui-kit-material/gpui-fast", "dep:gpui-fast-web"]

# Shared Gallery source contains native-only profiling code. This acknowledges
# that source's cfg without advertising a browser frame collector.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("frame-profiler"))'] }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-kit.workspace = true
gpui-base.workspace = true
# Only for this feature: the Gallery's frame counters read the engine's dev-only
# frame observation, which a consumer's web backends leave off. Kit already links
# these crates, and its normalized manifest keeps their threading off too.
gpui-pre-web = { version = "=0.3.10", default-features = false, features = ["frame-observation"] }
gpui-fast-web = { version = "0.1.12", default-features = false, features = ["frame-observation"], optional = true }
gpui-kit-material = { path = "../material", default-features = false, features = ["serde"] }
wasm-bindgen = "=0.2.129"
web-sys = { version = "=0.3.106", features = ["Window", "MediaQueryList", "MediaQueryListEvent", "EventTarget", "Location"] }
