# Vendored from longbridge/gpui-kit bb85882e1faab845d9e7be33b69a152879a90f69.
# Workspace inheritance expanded from that revision; see SOURCE.json.
[package]
name = "gpui-base-examples"
default-run = "components"
version = "0.8.1"
publish = false
edition = "2024"

[dependencies]
chrono = "0.4.38"
gpui = { "package" = "gpui-pre", "version" = "=0.3.10" }
gpui-fast = { "package" = "gpui-fast", "version" = "0.1.12", "features" = ["windows-manifest-provided-by-host"], "optional" = true }
gpui-base = { path = "../.." }
gpui_platform = { "package" = "gpui-pre-platform", "version" = "=0.3.10", "features" = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-fast-platform = { "package" = "gpui-fast-platform", "version" = "0.1.12", "features" = ["font-kit", "x11", "wayland", "runtime_shaders"], "optional" = true }
reqwest_client = { "package" = "gpui-pre-reqwest-client", "version" = "=0.3.10" }
syntect = { "version" = "5.3.0", "default-features" = false, "features" = ["parsing", "default-syntaxes", "regex-fancy"] }

[dev-dependencies]
gpui = { "package" = "gpui-pre", "version" = "=0.3.10", "features" = ["test-support"] }
gpui-fast = { "package" = "gpui-fast", "version" = "0.1.12", "features" = ["windows-manifest-provided-by-host", "test-support"] }

[lints]
clippy = { "almost_complete_range" = "allow", "arc_with_non_send_sync" = "allow", "borrowed_box" = "allow", "dbg_macro" = "deny", "let_underscore_future" = "allow", "manual_is_multiple_of" = "allow", "map_entry" = "allow", "module_inception" = "allow", "non_canonical_partial_ord_impl" = "allow", "reversed_empty_ranges" = "allow", "single_range_in_vec_init" = "allow", "style" = { "level" = "allow", "priority" = -1 }, "todo" = "deny", "type_complexity" = "allow", "useless_conversion" = "allow" }

# The shared showcase is included with `#[path]`, which cargo-machete cannot
# follow when detecting its `chrono`, `gpui`, `gpui_base`, and `syntect` imports.
[package.metadata.cargo-machete]
ignored = ["chrono", "gpui", "gpui-base", "syntect"]

[features]
gpui-fast = ["dep:gpui-fast", "dep:gpui-fast-platform"]
